name: Django AKS Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: ACR Login
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push Docker Image to ACR
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/django-app:${{ github.sha }} \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/django-app:latest \
          --push .

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --name ${{ secrets.AKS_CLUSTER }} \
          --overwrite-existing

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/django-app \
          django-app=${{ secrets.ACR_LOGIN_SERVER }}/django-app:${{ github.sha }}

    - name: Wait for Rollout
      run: |
        kubectl rollout status deployment/django-app --timeout=180s

    - name: Get External IP
      run: |
        echo "=========================================="
        echo "🚀 Application is Live at:"
        kubectl get service django-service --output jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
        echo "=========================================="
