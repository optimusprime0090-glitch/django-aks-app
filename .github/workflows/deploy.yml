name: Django AKS Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: ACR Login
      run: |
        az acr login --name shacr1

    - name: Build & Push Docker Image to ACR
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t shacr1.azurecr.io/django-app:${{ github.sha }} \
          -t shacr1.azurecr.io/django-app:latest \
          --push .

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --name ${{ secrets.AKS_CLUSTER }} \
          --overwrite-existing

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/django-app \
          django-app=shacr1.azurecr.io/django-app:${{ github.sha }}

    - name: Wait for Rollout
      run: |
        kubectl rollout status deployment/django-app

    - name: Get External IP
      run: |
        echo "=========================================="
        echo "🚀 Application is Live at:"
        kubectl get service django-service --output jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
        echo "=========================================="